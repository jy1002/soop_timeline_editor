<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SOOP Mock Page — QA</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
        #player-area { position: relative; width: 100%; height: 400px; background: #222; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; }
        /* 라이브 모드 시간 표시 (id="time") */
        #time { position: absolute; top: 10px; left: 10px; font-size: 14px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; }
        /* 시크바 (input[type=range]) */
        #seek-bar { position: absolute; bottom: 10px; left: 0; right: 0; width: 100%; }
    </style>
</head>
<body>
    <!-- SOOP VOD 플레이어 최소 구조 재현 -->
    <div id="player-area">
        <video id="mock-video"></video>
        <!-- 라이브 모드: 방송 경과 시간 표시 엘리먼트 -->
        <div id="time">00:01:23</div>
        <!-- VOD 시크바 -->
        <input type="range" id="seek-bar" min="0" max="3600" value="0">
    </div>

    <!-- 1. GM_* 폴리필 먼저 로드 -->
    <script src="gm-polyfill.js"></script>

    <!-- 2. video.currentTime 목 (VOD 기본값: 83초 = 1:23) -->
    <script>
        (function () {
            let _currentTime = 83;
            const video = document.getElementById('mock-video');
            Object.defineProperty(video, 'currentTime', {
                get: () => _currentTime,
                set: (v) => { _currentTime = v; video.dispatchEvent(new Event('timeupdate')); },
                configurable: true
            });
            Object.defineProperty(video, 'duration', {
                get: () => 3600,
                configurable: true
            });
            Object.defineProperty(video, 'readyState', {
                get: () => 4,
                configurable: true
            });
            video.play = () => Promise.resolve();
            video.pause = () => {};

            // 테스트에서 currentTime을 직접 설정할 수 있는 헬퍼
            window.__setVideoTime = function (sec) { _currentTime = sec; };
        })();
    </script>

    <!-- 3. 유저스크립트 로드 (IIFE 방식이라 즉시 실행) -->
    <script src="../soop_timeline_editor.user.js"></script>
</body>
</html>
